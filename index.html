<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PVZ（XDZ版）</title><meta name="description" content="PVZ（XDZ版）原创网页塔防游戏。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23f5c84b' stroke='%23191815' stroke-width='5' d='M32 5C20 5 8 22 9 35c2 14 17 23 23 24 7-1 22-10 23-24C56 22 44 5 32 5Z'/%3E%3Cpath fill='%23191815' d='M25 22h14v7H25zm0 13h14v7H25z'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<main class="game-shell"><header class="hud"><div class="brand"><span>◆</span><strong>PVZ（XDZ版）</strong><small>LIVE AT THE BACKYARD</small></div><div class="currency"><img src="assets/pick.webp" alt="拨片"><b id="currency">12</b></div><div class="wave"><span id="waveText">第 1 关 · 准备 10 秒</span><div class="meter"><i id="waveBar"></i></div></div><button id="pauseBtn" class="icon-btn" aria-label="暂停">Ⅱ</button></header>
<section class="stage-wrap"><aside class="cards"><button class="card" data-unit="single" aria-pressed="false"><span class="cost">4 ◆</span><img src="assets/henghengjun.webp" alt="哼哼俊"><b>哼哼俊</b><small>普通射手</small><span class="cooldown-label"></span></button><button class="card" data-unit="double" aria-pressed="false"><span class="cost">8 ◆</span><img src="assets/lizhousalt.webp" alt="离轴盐"><b>离轴盐</b><small>粉色双重射手</small><span class="cooldown-label"></span></button><button class="card" data-unit="wall" aria-pressed="false"><span class="cost">2 ◆</span><img src="assets/jianguo.webp" alt="建国"><b>建国</b><small>防御植物</small><span class="cooldown-label"></span></button><button class="card" data-unit="squash" aria-pressed="false"><span class="cost">2 ◆</span><img src="assets/eggshell.webp" alt="鸡蛋壳"><b>鸡蛋壳</b><small>压死僵尸</small><span class="cooldown-label"></span></button><button class="card" data-unit="dancer" aria-pressed="false"><span class="cost">0 ◆</span><img src="assets/speaker.webp" alt="扩音器"><b>扩音器</b><small>只会跳舞</small><span class="cooldown-label"></span></button><button class="card" data-unit="scare" aria-pressed="false"><span class="cost">2 ◆</span><img src="assets/zhoumian.webp" alt="周面"><b>周面</b><small>恐吓换道</small><span class="cooldown-label"></span></button><button class="card" data-unit="cannon" aria-pressed="false"><span class="cost">10 ◆</span><img src="assets/bass-cannon.webp" alt="贝斯加农炮"><b>贝斯加农炮</b><small>点击手动发射</small><span class="cooldown-label"></span></button><button class="card" data-unit="pocket" aria-pressed="false"><span class="cost">2 ◆</span><img src="assets/pants.webp" alt="果汁说的裤子"><b>果汁说的裤子</b><small>生产拨片</small><span class="cooldown-label"></span></button><button id="shovel" class="shovel" aria-pressed="false">⌁<span>移除</span></button></aside><div class="play-column"><div id="selectionStatus" class="selection-status idle"><span>当前选择</span><strong>暂无</strong><small>请先点击左侧植物卡片</small></div><div class="board-frame"><div class="stage-glow"></div><div id="board" class="board"></div><div id="floatLayer" class="float-layer"></div></div></div></section><footer><span>先选植物，每次只能放置一个</span><span>◆ 拨片会从上方掉落，点击收集</span></footer></main>
<div id="startScreen" class="overlay show"><div class="poster"><p>TONIGHT ONLY</p><h1>PVZ<br><span>（XDZ版）</span></h1><div class="poster-line"></div><div class="level-select"><strong>选择关卡</strong><div class="level-buttons"><button class="level-btn selected" data-level="0">1</button><button class="level-btn" data-level="1">2</button><button class="level-btn" data-level="2">3</button><button class="level-btn" data-level="3">4</button><button class="level-btn" data-level="4">5</button></div></div><button id="startBtn">开始第 1 关</button><small>5 关挑战 · 分波进攻</small></div></div><div id="pauseScreen" class="overlay"><div class="result"><p>PAUSED</p><h2>游戏暂停</h2><div class="pause-level-select"><strong>切换关卡</strong><div class="pause-level-buttons"><button class="pause-level-btn selected" data-level="0">1</button><button class="pause-level-btn" data-level="1">2</button><button class="pause-level-btn" data-level="2">3</button><button class="pause-level-btn" data-level="3">4</button><button class="pause-level-btn" data-level="4">5</button></div><small>点击关卡后将重新开始该关</small></div><button id="resumeBtn">继续游戏</button></div></div><div id="endScreen" class="overlay"><div class="result"><p id="resultKicker">ENCORE!</p><h2 id="resultTitle">挑战成功</h2><p id="resultText">所有入侵者都被赶走了。</p><button id="restartBtn">下一关</button></div></div><div id="targetOverlay" class="target-overlay" role="button" tabindex="0" aria-label="选择贝斯加农炮落点"><div class="target-hint">移动准星 · 点击任意位置发射 · ESC 取消</div><div id="targetReticle" class="target-reticle"><i></i></div></div><script src="game.js"></script></body></html>
